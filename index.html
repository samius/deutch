<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deutch — vzdělávací appky</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 3rem 1.5rem 1.5rem;
    text-align: center;
  }
  header h1 {
    margin: 0 0 0.5rem;
    font-size: 2.2rem;
  }
  header p {
    color: var(--muted);
    margin: 0;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem 1.5rem 3rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
  }
  a.card {
    display: block;
    background: var(--card);
    border-radius: 12px;
    padding: 1.25rem;
    text-decoration: none;
    color: var(--text);
    border: 1px solid #334155;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  a.card h2 {
    margin: 0 0 0.4rem;
    font-size: 1.15rem;
    color: var(--accent);
  }
  a.card p {
    margin: 0 0 0.6rem;
    color: var(--muted);
    font-size: 0.92rem;
  }
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: #0ea5e933;
    color: var(--accent);
    margin-right: 0.3rem;
  }
  .empty, .error {
    color: var(--muted);
    text-align: center;
    margin-top: 2rem;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 1.5rem;
  }
</style>
</head>
<body>
<header>
  <h1>🇩🇪 Deutch</h1>
  <p>Vzdělávací appky pro žáky základní školy</p>
</header>
<main>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" style="display:none">Zatím tu žádné appky nejsou — brzy přibudou.</p>
</main>
<footer>deutch.krupa.link · zdrojový kód na <a href="https://github.com/samius/deutch" style="color:var(--accent)">GitHub</a></footer>

<script>
  fetch('apps.json')
    .then(r => r.json())
    .then(apps => {
      const grid = document.getElementById('grid');
      if (!apps.length) {
        document.getElementById('empty').style.display = 'block';
        return;
      }
      grid.innerHTML = apps.map(app => `
        <a class="card" href="${app.slug}/">
          <h2>${app.title}</h2>
          <p>${app.description}</p>
          <span class="tag">${app.subject}</span>
          <span class="tag">${app.grade}</span>
        </a>
      `).join('');
    })
    .catch(() => {
      document.getElementById('empty').textContent = 'Nepodařilo se načíst seznam appek.';
      document.getElementById('empty').style.display = 'block';
    });
</script>
</body>
</html>
